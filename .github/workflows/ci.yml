name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shellcheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck -x -P . -s bash

      - name: Bash tests
        run: bash tests/run-tests.sh
